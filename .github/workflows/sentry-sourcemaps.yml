name: Sentry Source Maps Upload

# TEMPORARILY DISABLED
# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  upload_sourcemaps:
    name: Upload Source Maps to Sentry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npx vite build

      - name: Upload Source Maps via Sentry CLI
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_CLIENT }}
        run: |
          VERSION=$(npx @sentry/cli releases propose-version)
          echo "Releasing version: $VERSION"
          npx @sentry/cli releases new -p ${{ secrets.SENTRY_PROJECT_CLIENT }} "$VERSION"
          npx @sentry/cli releases set-commits --auto "$VERSION"
          npx @sentry/cli sourcemaps upload --release "$VERSION" ./dist/client --url-prefix '~/ai.studio'
          npx @sentry/cli releases finalize "$VERSION"
